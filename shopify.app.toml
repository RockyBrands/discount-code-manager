# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "ec3631460a2c12549b32ade9bf269ea7"
name = "Rocky Coupon Code Generator"
application_url = "https://discount-code-manager.netlify.app"
embedded = true

[build]
automatically_update_urls_on_dev = true

[access_scopes]
scopes = "write_discounts,read_discounts,read_products,read_orders"

[auth]
redirect_urls = [
  "https://discount-code-manager.netlify.app/api/shopify/callback"
]

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = ["orders/create"]
  uri = "/api/webhooks/orders"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/api/webhooks/uninstalled"

  [webhooks.privacy_compliance]
  customer_deletion_url = "https://discount-code-manager.netlify.app/api/webhooks/compliance"
  customer_data_request_url = "https://discount-code-manager.netlify.app/api/webhooks/compliance"
  shop_deletion_url = "https://discount-code-manager.netlify.app/api/webhooks/compliance"
